[tox]
envlist = lint, unit, integration
skipsdist = true

[testenv:lint]
description = Lint and format check
deps =
    ruff
    mypy
    types-requests
commands =
    ruff check src/ lib/ tests/
    ruff format --check src/ lib/ tests/
    mypy src/ lib/ --ignore-missing-imports

[testenv:unit]
description = Run unit tests
deps =
    pytest
    coverage[toml]
    ops >= 2.0
commands =
    coverage run -m pytest tests/unit/ -v
    coverage report

[testenv:integration]
description = Run integration tests with a real Juju controller
deps =
    pytest
    pytest-operator
    ops >= 2.0
commands =
    pytest tests/integration/ -v --tb=long

[testenv:fmt]
description = Auto-format code
deps =
    ruff
commands =
    ruff format src/ lib/ tests/
    ruff check --fix src/ lib/ tests/