type: charm
# Build with charmcraft ≥ 4.0 for all platforms.
# Use --platform to select the target:
#   charmcraft pack --platform ubuntu@22.04:amd64
#   charmcraft pack --platform ubuntu@24.04:amd64  
#   charmcraft pack --platform ubuntu@26.04:amd64
#
# For 22.04/24.04 cross-builds from a 26.04 host, use:
#   charmcraft pack --platform ubuntu@22.04:amd64 --use-lxd
platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

parts:
  charm:
    charm-python-packages: [ops]